<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Swibo + Loctl Preview</title>
<style>
  :root{font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;color-scheme:dark;color:#f1efe8;background:#0d0f11}
  *{box-sizing:border-box}
  body{margin:0;font-size:14px}
  button{font:inherit;cursor:pointer;color:inherit}
  button:disabled{opacity:.35;cursor:default}
  header{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:17px 22px;border-bottom:1px solid #30373d;background:#121518}
  h1{font-size:18px;font-weight:650;letter-spacing:.02em;margin:0}
  .hint{font-size:12px;color:#9aa6ad;margin-top:5px}
  nav{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow:auto;padding:12px 22px;border-bottom:1px solid #30373d}
  nav button{border:1px solid transparent;border-radius:6px;background:none;white-space:nowrap;padding:8px 18px}
  nav button.active{background:#242a30;border-color:#465059}
  main{padding:22px;max-width:1500px;margin:auto}
  .row{display:grid;grid-template-columns:minmax(170px,1.5fr) minmax(110px,.65fr) 80px 140px minmax(140px,.85fr);align-items:center;gap:16px;padding:12px 14px;border-bottom:1px solid #30373d}
  .row:nth-child(even){background:#121518}
  .head{color:#9aa6ad;font-size:12px;font-weight:600;border-top:1px solid #30373d}
  .row strong{font-size:14px;font-weight:600}
  .row small{display:block;color:#9aa6ad;margin-top:4px;overflow:hidden;text-overflow:ellipsis}
  .lamp{display:inline-block;width:7px;height:7px;border-radius:50%;background:#8b959d;margin-right:8px}
  .ready .lamp{background:#65c394}.degraded .lamp,.stale .lamp{background:#e4ac4f}.stale{color:#e4ac4f}
  .actions{display:flex;gap:4px}.actions button{border:1px solid #465059;border-radius:5px;background:#1d2227;min-width:34px;min-height:31px}
  .actions button:hover:not(:disabled){background:#30373d}
  .autostart{color:#d8a84d;font-weight:600}
  .autostart-toggle{border:1px solid #465059;border-radius:6px;background:#1d2227;padding:5px 8px;font-size:12px}
  #error{min-height:18px;color:#ed7871;margin-bottom:12px}
  .foot{margin-top:20px;color:#9aa6ad;font-size:12px}
  #refresh{background:#1d2227;border:1px solid #465059;border-radius:6px;padding:8px 13px}
  .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
  .toolbar button,.edit-target,.expand-target,.editor-actions button{background:#1d2227;border:1px solid #465059;border-radius:6px;padding:6px 10px}
  .runtime-detail{grid-column:1/-1;display:grid;gap:5px;color:#9aa6ad;font-size:12px;padding:8px 0}
  dialog{background:#171b1f;border:1px solid #465059;border-radius:10px;color:inherit;width:min(720px,92vw);padding:20px}
  dialog::backdrop{background:#0009}
  dialog textarea{width:100%;min-height:340px;background:#0d0f11;color:inherit;border:1px solid #465059;border-radius:6px;padding:12px;font:12px/1.5 Consolas,monospace;resize:vertical}
  .editor-actions{display:flex;gap:8px;margin-top:12px}
  .editor-actions .danger{margin-left:auto;color:#ed7871}
  .module-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:16px}
  .module-card{background:#171b1f;border:1px solid #30373d;border-radius:8px;padding:14px;min-height:110px}
  .module-card .meta{color:#9aa6ad;font-size:12px;margin:7px 0 12px}
  .module-card .actions{flex-wrap:wrap}
  .module-card button{padding:4px 10px}
  .launcher-filter{display:flex;align-items:center;gap:10px}
  .launcher-filter input{width:min(340px,100%);border:1px solid #465059;border-radius:6px;background:#1d2227;color:inherit;padding:9px 12px}
  .module-card{display:flex;flex-direction:column;gap:6px;min-height:0}
  .module-card .meta{margin:0 0 6px}
  .module-card .pin{color:#d8a84d}
  .module-card.selected{border-color:#7295ae;background:#212930}
  .module-head{display:flex;align-items:center;gap:10px}
  .module-glyph{display:grid;place-items:center;width:30px;height:30px;flex:none;border-radius:7px;background:#263039;color:#cad4d9;font-size:11px;overflow:hidden}
  .module-glyph img{width:100%;height:100%;object-fit:contain}
  .module-card .select-module{border:0;text-align:left;background:transparent;padding:0;min-height:24px;font-weight:600}
  .module-stage{border:1px solid #30373d;border-radius:8px;padding:18px;margin-top:14px}
  .module-stage h3{font-size:17px;margin:0 0 8px}
  .module-stage .section{margin:18px 0 0}
  .module-stage h4{font-size:12px;font-weight:650;color:#a7b2b7;margin:0 0 8px}
  .module-stage .fact{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid #30373d;padding:8px 0}
  .module-stage .fact span:last-child{text-align:right}
  .module-stage .issue{color:#ed7871;white-space:pre-wrap}
  .module-stage .actions{flex-wrap:wrap}
  @media(max-width:760px){.row{grid-template-columns:minmax(120px,1.4fr) 85px 60px 110px;gap:6px;padding:12px 5px}.row>.monitor{display:none}main{padding:8px}header{padding:14px}nav{padding:10px}}
</style>
</head>
<body>
<header><div><h1>SWIBO / LOCTL</h1><div class="hint">単一WebView2 統合プレビュー · 既存アプリは変更しません</div></div><div><span id="stream-state" class="hint" role="status">Connecting…</span> <button id="refresh" type="button">更新</button></div></header>
<nav aria-label="メインタブ">
  <button class="active" id="runtime-tab" aria-current="page">Runtimes</button>
  <button id="launcher-tab">Launcher</button>
</nav>
<main>
<div id="error" role="status" aria-live="polite"></div>
<section id="runtime-panel">
<div class="toolbar"><button id="start-all" type="button">Start all</button><button id="stop-all" type="button">Stop all</button><button id="add-target" type="button">Add target</button></div>
<div class="row head"><span>RUNTIME</span><span>STATUS</span><span>AUTO</span><span>OPERATIONS</span><span class="monitor">MONITOR</span></div>
<div id="targets" aria-live="off"></div>
<p class="foot">Swiboの既存API・registryを共有します。変更は通常のSwiboにも反映されます。</p>
</section>
<section id="launcher-panel" hidden>
  <div class="launcher-filter"><h2>Launcher</h2><input id="module-search" type="search" placeholder="Search modules…" aria-label="Search modules"></div>
  <p class="foot">Loctlの既存モジュール登録情報・アダプターを、別WebView2を起動せず読み取ります。</p>
  <div id="modules" class="module-list"></div>
  <div id="module-stage" class="module-stage" hidden aria-live="polite"></div>
</section>
</main>
<dialog id="target-editor"><form method="dialog"><h2 id="editor-title">Edit target</h2><p class="hint">Swibo registry JSON。保存時はdaemon側で既存と同じ検証を実施します。</p><textarea id="target-json" aria-label="Target JSON" spellcheck="false"></textarea><p id="editor-error" role="alert" class="issue"></p><div class="editor-actions"><button type="button" id="save-target">Save</button><button type="submit">Cancel</button><button type="button" id="delete-target" class="danger">Delete target</button></div></form></dialog>
<script>
"use strict";
const api = globalThis.__TAURI__?.core?.invoke;
const targets = document.querySelector("#targets");
const error = document.querySelector("#error");
const refreshButton = document.querySelector("#refresh");
const streamState = document.querySelector("#stream-state");
const runtimeTab = document.querySelector("#runtime-tab");
const launcherTab = document.querySelector("#launcher-tab");
const runtimePanel = document.querySelector("#runtime-panel");
const launcherPanel = document.querySelector("#launcher-panel");
const modules = document.querySelector("#modules");
const moduleSearch = document.querySelector("#module-search");
const moduleStage = document.querySelector("#module-stage");
const editorDialog = document.querySelector("#target-editor");
const editorText = document.querySelector("#target-json");
const editorError = document.querySelector("#editor-error");
const deleteTargetButton = document.querySelector("#delete-target");
let snapshot = { targets: [] };
let moduleSnapshot = { modules: [], issues: [] };
const moduleStatuses = new Map();
const moduleDetails = new Map();
const moduleIcons = new Map();
let iconSequence = Promise.resolve();
let selectedModuleId = null;
let activeView = "runtime";
let busy = false;
let editingId = null;
const CACHE_STALE_AFTER_MS = 2 * 60 * 1000;
let freshnessTimer = null;
function targetIsStale(target, now = Date.now()) {
  const timestamp = Date.parse(target?.checkedAt ?? "");
  return !Number.isFinite(timestamp) || now - timestamp >= CACHE_STALE_AFTER_MS;
}
function scheduleFreshnessRender() {
  clearTimeout(freshnessTimer);
  let earliest = Infinity;
  const now = Date.now();
  for (const target of snapshot.targets || []) {
    const stamp = Date.parse(target.checkedAt ?? "");
    if (!Number.isFinite(stamp)) continue;
    const remaining = stamp + CACHE_STALE_AFTER_MS - now;
    if (remaining > 0 && remaining < earliest) earliest = remaining;
  }
  if (Number.isFinite(earliest)) {
    freshnessTimer = setTimeout(render, Math.min(Math.ceil(earliest) + 20, 2_147_483_647));
  }
}
const expandedTargets = new Set();
function button(label, title, action, target, component) {
  const btn = document.createElement("button");
  btn.textContent = label;
  btn.title = title;
  btn.setAttribute("aria-label", title);
  btn.dataset.action = action;
  btn.dataset.target = target;
  if (component) btn.dataset.component = component;
  return btn;
}
function render() {
  targets.replaceChildren();
  for (const t of snapshot.targets || []) {
    const row = document.createElement("article");
    row.className = "row";
    const identity = document.createElement("div");
    const strong = document.createElement("strong");
    strong.textContent = t.name;
    const detail = document.createElement("small");
    detail.textContent = t.id;
    const detailsButton = button(expandedTargets.has(t.id) ? "− Details" : "+ Details", "Toggle details for "+t.name, "expand", t.id);
    detailsButton.className = "expand-target";
    const editButton = button("Edit", "Edit "+t.name, "edit", t.id);
    editButton.className = "edit-target";
    identity.append(strong, detail, detailsButton, editButton);
    const status = document.createElement("span");
    const stale = targetIsStale(t);
    status.className = stale ? "stale" : String(t.state || "").toLowerCase();
    if (stale) status.title = "Last observed " + (t.state || "UNKNOWN") + "; refresh to verify";
    const lamp = document.createElement("span");
    lamp.className = "lamp";
    status.append(lamp, document.createTextNode(stale ? "STALE" : (t.state || "UNKNOWN")));
    const auto = document.createElement("button");
    auto.type = "button";
    auto.className = "autostart-toggle" + (t.startupPolicy === "auto" ? " autostart" : "");
    auto.dataset.autostartTarget = t.id;
    auto.setAttribute("role", "switch");
    auto.setAttribute("aria-checked", String(t.startupPolicy === "auto"));
    auto.setAttribute("aria-label", "Auto Start for " + t.name);
    auto.textContent = t.startupPolicy === "auto" ? "ON" : "OFF";
    auto.disabled = busy || !t.enabled;
    const actions = document.createElement("div");
    actions.className = "actions";
    for (const [kind, label] of [["start","▶"],["stop","■"],["restart","↻"]]) {
      const btn = button(label, kind+" "+t.name, kind, t.id);
      btn.disabled = busy || !t.enabled || stale;
      actions.append(btn);
    }
    const monitors = document.createElement("div");
    monitors.className = "actions monitor";
    for (const [key, c] of Object.entries(t.components || {})) {
      if (c.notApplicable) continue;
      for (const [action, symbol] of [["start","▶"],["stop","■"],["restart","↻"]]) {
        const control = button(symbol, action+" "+(c.label||key), "component-"+action, t.id, key);
        control.disabled = busy || !t.enabled || stale;
        monitors.append(control);
      }
    }
    row.append(identity, status, auto, actions, monitors);
    if (expandedTargets.has(t.id)) {
      const details = document.createElement("div");
      details.className = "runtime-detail";
      for (const [label, data] of [["Server",t.server],["Tunnel",t.tunnel],["Last check",t.checkedAt]]) {
        const line = document.createElement("div");
        line.textContent = label + ": " + (typeof data === "object" && data ? [data.ready ? "READY" : "NOT READY",data.detail || data.error].filter(Boolean).join(" · ") : String(data ?? "N/A"));
        details.append(line);
      }
      row.append(details);
    }
    targets.append(row);
  }
  scheduleFreshnessRender();
}
async function request(kind, targetId, component) {
  if (typeof api !== "function") throw Error("Tauriブリッジに接続できません");
  const value = await api("unified_swibo_request", { kind, targetId, component });
  return JSON.parse(value);
}
async function registry(kind, targetId, target) {
  if (typeof api !== "function") throw Error("Tauriブリッジに接続できません");
  return JSON.parse(await api("unified_swibo_registry", { kind, targetId, target }));
}
function openEditor(id=null) {
  const current = snapshot.registry?.targets?.find(target => target.id === id);
  if (id && !current) { error.textContent = "Target registry entry not found"; return; }
  editingId = id;
  document.querySelector("#editor-title").textContent = current ? "Edit "+current.name : "Add target";
  editorText.value = JSON.stringify(current || {id:"new-target",name:"New target",enabled:false,startupPolicy:"manual",lifecycle:{},checks:{server:{type:"none"},tunnel:{type:"none"}}},null,2);
  editorError.textContent = "";
  deleteTargetButton.hidden = !id;
  editorDialog.showModal();
}
async function loctl(kind, moduleId, operation) {
  if (typeof api !== "function") throw Error("Tauriブリッジに接続できません");
  const reply = JSON.parse(await api("unified_loctl_request", {kind, moduleId, operation}));
  if (!reply.ok) throw Error(reply.error || "Loctl operation failed");
  return reply.value;
}
function moduleGlyph(module) {
  const glyph = document.createElement("span");
  glyph.className = "module-glyph";
  glyph.setAttribute("aria-hidden", "true");
  const fallback = module.icon || module.name.slice(0, 2).toUpperCase();
  if (module.iconType !== "file") {
    glyph.textContent = fallback;
    return glyph;
  }
  const image = document.createElement("img");
  image.alt = "";
  image.addEventListener("error", () => glyph.replaceChildren(document.createTextNode(fallback)), {once:true});
  glyph.append(image);
  if (!moduleIcons.has(module.id)) {
    // Each icon is a one-shot Loctl process. Serialize cold loads to avoid
    // starting a burst of short-lived WebView-free runtimes.
    const loadIcon = iconSequence.then(() => loctl("module_icon", module.id)).then(value => {
      const bytes = Uint8Array.from(value.bytes);
      return URL.createObjectURL(new Blob([bytes], {type:value.mimeType}));
    }).catch(() => null);
    iconSequence = loadIcon.then(() => undefined);
    moduleIcons.set(module.id, loadIcon);
  }
  moduleIcons.get(module.id).then(url => {
    if (!image.isConnected) return;
    if (url) image.src = url;
    else glyph.replaceChildren(document.createTextNode(fallback));
  });
  return glyph;
}
function renderModules() {
  modules.replaceChildren();
  const query = moduleSearch.value.trim().toLowerCase();
  const visible = (moduleSnapshot.modules || []).filter(m => m.enabled && (
    !query || [m.name,m.description,m.id].some(value => String(value||"").toLowerCase().includes(query))
  )).sort((a,b) => Number(b.pinned)-Number(a.pinned) || (a.order||100)-(b.order||100));
  for (const m of visible) {
    if (!m.enabled) continue;
    const card = document.createElement("article");
    card.className = "module-card";
    card.classList.toggle("selected", m.id === selectedModuleId);
    const name = document.createElement("button");
    name.type = "button";
    name.className = "select-module";
    name.dataset.moduleSelect = m.id;
    name.textContent = (m.pinned ? "★ " : "") + m.name;
    if (m.pinned) name.classList.add("pin");
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = m.description;
    const status = document.createElement("div");
    status.className = "meta";
    status.textContent = moduleStatuses.get(m.id) || "Ready to query";
    status.dataset.status = m.id;
    const actions = document.createElement("div");
    actions.className = "actions";
    for (const operation of ["status","open","start","stop","restart","diagnose","settings"]) {
      if (!m.capabilities.includes(operation)) continue;
      const btn = button(operation, operation + " " + m.name, "loctl-"+operation, m.id);
      btn.disabled = busy;
      actions.append(btn);
    }
    const head = document.createElement("div");
    head.className = "module-head";
    head.append(moduleGlyph(m), name);
    card.append(head, meta, status, actions);
    modules.append(card);
  }
  if (moduleSnapshot.issues?.length) {
    error.textContent = moduleSnapshot.issues.map(issue => issue.message).join("; ");
  }
  renderModuleStage();
}
function section(parent, heading, rows, makeRow) {
  if (!rows?.length) return;
  const container = document.createElement("div");
  container.className = "section";
  const title = document.createElement("h4");
  title.textContent = heading;
  container.append(title);
  for (const row of rows) container.append(makeRow(row));
  parent.append(container);
}
function fact(label, value, detail="") {
  const line = document.createElement("div");
  line.className = "fact";
  const l = document.createElement("span");
  l.textContent = String(label ?? "");
  const r = document.createElement("span");
  r.textContent = [value,detail].filter(Boolean).join(" · ");
  line.append(l,r);
  return line;
}
function renderModuleStage() {
  const selected = moduleSnapshot.modules.find(m => m.id === selectedModuleId && m.enabled);
  moduleStage.replaceChildren();
  moduleStage.hidden = !selected;
  if (!selected) return;
  const heading = document.createElement("h3");
  heading.textContent = selected.name;
  const description = document.createElement("p");
  description.className = "meta";
  description.textContent = selected.description;
  moduleStage.append(heading,description);
  const detail = moduleDetails.get(selected.id);
  if (detail?.error) {
    const issue = document.createElement("p");
    issue.className = "issue";
    issue.textContent = detail.error;
    moduleStage.append(issue);
  }
  const payload = detail?.value;
  moduleStage.append(fact("STATUS", payload?.state || "UNKNOWN", payload?.detail || ""));
  if (!payload && selected.capabilities.includes("status")) {
    const refresh = button("Check status", "Check status "+selected.name, "loctl-status", selected.id);
    moduleStage.append(refresh);
  }
  if (payload) {
    section(moduleStage, "SIGNALS", payload.signals, x => fact(x.label,x.value,x.detail));
    section(moduleStage, "QUICK VIEW", payload.quickView, x => fact(x.label,x.state,x.detail));
    section(moduleStage, "RECENT", payload.activity, x => fact(x.timestamp,x.message));
  }
}
async function setView(view) {
  activeView = view;
  runtimePanel.hidden = view !== "runtime";
  launcherPanel.hidden = view !== "launcher";
  runtimeTab.classList.toggle("active", view === "runtime");
  launcherTab.classList.toggle("active", view === "launcher");
  runtimeTab.toggleAttribute("aria-current", view === "runtime");
  launcherTab.toggleAttribute("aria-current", view === "launcher");
  error.textContent = "";
  if (view === "launcher") {
    try {
      moduleSnapshot = await loctl("registry");
      if (!moduleSnapshot.modules.some(m=>m.enabled && m.id===selectedModuleId)) {
        selectedModuleId = moduleSnapshot.modules.find(m=>m.enabled && m.pinned)?.id
          || moduleSnapshot.modules.find(m=>m.enabled)?.id || null;
      }
      renderModules();
    }
    catch (err) { error.textContent = String(err); }
  }
}
async function load(kind="status") {
  busy = true;
  refreshButton.disabled = true;
  error.textContent = "";
  try {
    snapshot = await request(kind);
  } catch (err) { error.textContent = String(err); }
  finally { busy = false; refreshButton.disabled = false; render(); }
}
for (const kind of ["start-all","stop-all"]) {
  document.querySelector("#"+kind).addEventListener("click", async () => {
    if (busy || !confirm(kind+" managed runtimes?")) return;
    busy = true;
    error.textContent = "";
    render();
    let failure = "";
    try { await request(kind); }
    catch (err) { failure = String(err); }
    finally {
      busy = false;
      await load("status");
      if (failure) error.textContent = failure;
    }
  });
}
document.querySelector("#add-target").addEventListener("click", () => openEditor());
document.querySelector("#save-target").addEventListener("click", async () => {
  if (busy) return;
  let value;
  try { value = JSON.parse(editorText.value); }
  catch (err) { editorError.textContent = "Invalid JSON: "+err.message; return; }
  busy = true;
  try {
    await registry(editingId ? "update" : "add", editingId, value);
    editorDialog.close();
    await load("status");
  } catch (err) { editorError.textContent = String(err); }
  finally { busy = false; }
});
deleteTargetButton.addEventListener("click", async () => {
  if (!editingId || busy || !confirm("Remove "+editingId+" from registry? This does not stop its process.")) return;
  busy = true;
  try { await registry("remove", editingId); editorDialog.close(); await load("status"); }
  catch (err) { editorError.textContent = String(err); }
  finally { busy = false; }
});
refreshButton.addEventListener("click", async () => {
  if (activeView === "runtime") await load("refresh");
  else await setView("launcher");
});
if (globalThis.__TAURI__?.event?.listen) {
  globalThis.__TAURI__.event.listen("unified-swibo-status", event => {
    if (!busy && Array.isArray(event.payload?.targets)) {
      snapshot = event.payload;
      render();
    }
    streamState.textContent = "Live · " + new Date().toLocaleTimeString();
  }).then(() => api("unified_swibo_watch")).catch(err => {
    streamState.textContent = "Disconnected";
    error.textContent = String(err);
  });
} else {
  streamState.textContent = "No event bridge";
}
runtimeTab.addEventListener("click", () => setView("runtime"));
launcherTab.addEventListener("click", () => setView("launcher"));
moduleSearch.addEventListener("input", renderModules);
document.addEventListener("keydown", event => {
  if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "k") {
    event.preventDefault();
    setView("launcher").then(() => moduleSearch.focus());
  }
});
modules.addEventListener("click", async event => {
  const btn = event.target.closest("button[data-action],button[data-module-select]");
  if (btn?.dataset.moduleSelect) {
    selectedModuleId = btn.dataset.moduleSelect;
    renderModules();
    const module = moduleSnapshot.modules.find(m=>m.id===selectedModuleId);
    if (module?.capabilities.includes("status") && !moduleDetails.has(selectedModuleId)) {
      try { moduleDetails.set(selectedModuleId, {value: await loctl("module_status",selectedModuleId)}); }
      catch (err) { moduleDetails.set(selectedModuleId,{error:String(err)}); }
      renderModules();
    }
    return;
  }
  if (!btn || busy) return;
  busy = true;
  renderModules();
  error.textContent = "";
  try {
    const operation = btn.dataset.action.replace("loctl-", "");
    const response = operation === "status"
      ? await loctl("module_status", btn.dataset.target)
      : await loctl("module_action", btn.dataset.target, operation);
    moduleStatuses.set(btn.dataset.target, [response.state, response.detail, response.message].filter(Boolean).join(" · ") || "Action completed");
    moduleDetails.set(btn.dataset.target, {value:response});
    if (operation !== "status" && moduleSnapshot.modules.find(m=>m.id===btn.dataset.target)?.capabilities.includes("status")) {
      const refreshed = await loctl("module_status",btn.dataset.target);
      moduleDetails.set(btn.dataset.target,{value:refreshed});
    }
  } catch (err) {
    moduleDetails.set(btn.dataset.target,{error:String(err)});
    error.textContent = String(err);
  }
  finally { busy = false; renderModules(); }
});
targets.addEventListener("click", async (event) => {
  const btn = event.target.closest("button[data-action],button[data-autostart-target]");
  if (!btn || busy) return;
  if (btn.dataset.action === "expand") {
    expandedTargets.has(btn.dataset.target) ? expandedTargets.delete(btn.dataset.target) : expandedTargets.add(btn.dataset.target);
    render();
    return;
  }
  if (btn.dataset.action === "edit") { openEditor(btn.dataset.target); return; }
  busy = true;
  error.textContent = "";
  render();
  try {
    if (btn.dataset.autostartTarget) {
      const enabled = btn.getAttribute("aria-checked") !== "true";
      await api("unified_swibo_autostart", {targetId:btn.dataset.autostartTarget, enabled});
    } else {
      await request(btn.dataset.action, btn.dataset.target, btn.dataset.component);
    }
    snapshot = await request("status");
  } catch (err) { error.textContent = String(err); }
  finally { busy = false; render(); }
});
load("refresh");
</script>
</body>
</html>
