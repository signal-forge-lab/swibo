<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Loctl — Swibo統合モック</title>
<!-- v1.1 · 2026-10-05. Reference: swibo-parts-design-sheet-v2.html; icons from ui/app.js.
     Standalone design prototype. All target states and actions are sample data. -->
<style>
:root {
  color-scheme: dark;
  --bg: #0d0f11;
  --surface: #121518;
  --surface-2: #171b1f;
  --surface-3: #1d2227;
  --surface-4: #242a30;
  --line: #30373d;
  --line-strong: #465059;
  --text: #f1efe8;
  --text-2: #bac0c4;
  --text-3: #879199;
  --brass: #d8a84d;
  --brass-strong: #f0bd5a;
  --brass-soft: #2a2318;
  --ready: #65c394;
  --warn: #e4ac4f;
  --danger: #ed7871;
  --stopped: #8b959d;
  --focus: #f0bd5a;
  --scroll-track: #0b0e10;
  --scroll-thumb: #384149;
  --scroll-thumb-hover: #59636c;
  font-family: "Segoe UI Variable Text", "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--scroll-thumb) var(--scroll-track)}
*::-webkit-scrollbar{width:10px;height:10px}*::-webkit-scrollbar-track{background:var(--scroll-track)}*::-webkit-scrollbar-thumb{background:var(--scroll-thumb);border:2px solid var(--scroll-track);border-radius:999px}
body{margin:0;min-width:320px;font:14px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.32}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}[hidden]{display:none!important}
h1,h2,h3,p{margin:0}svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.shell{max-width:1480px;margin:12px auto;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px}
.topbar{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 18px;background:#101316;border-bottom:1px solid var(--line-strong);border-radius:10px 10px 0 0}
.brand{display:flex;align-items:center;gap:12px}.brand-glyph{display:grid;place-items:center;width:38px;height:38px;color:var(--brass-strong);background:var(--brass-soft);border:1px solid #66502a;border-radius:8px}.brand-glyph svg{width:24px;height:24px}
h1{font-size:16px;font-weight:700;line-height:1.2}.brand p{margin-top:3px;color:var(--text-3);font-size:12px}.demo-status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2)}
.mock-badge{font:11px/1.2 "Cascadia Mono",Consolas,monospace;color:var(--brass-strong);background:var(--brass-soft);padding:5px 7px;border:1px solid #66502a;border-radius:4px}
.tabs{display:flex;gap:24px;flex-wrap:wrap;padding:0 18px;border-bottom:1px solid var(--line-strong);background:#101316}
.tab{min-height:46px;padding:0 3px;color:var(--text-3);background:transparent;border:0;border-bottom:2px solid transparent;font-size:13px;font-weight:650}
.tab:hover{color:var(--text)}.tab[aria-selected="true"]{color:var(--brass-strong);border-bottom-color:var(--brass)}
.content{padding:14px 16px 18px}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px;min-height:40px}
.toolbar-group{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.button{min-height:36px;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:0 12px;color:var(--text-2);background:var(--surface-3);border:1px solid var(--line-strong);border-radius:6px;font-size:12px;font-weight:650}
.button:hover:not(:disabled){color:var(--text);background:var(--surface-4)}.button.primary{color:#17130c;background:var(--brass);border-color:var(--brass-strong)}
.button.destructive{color:var(--danger);background:transparent;border-color:#653633}.button.quiet{background:transparent;border-color:transparent}
.updated{font-size:12px;color:var(--text-3)}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:10px;background:#101316;border:1px solid var(--line-strong)}
.signal{min-height:52px;padding:9px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}.signal+.signal{border-left:1px solid var(--line)}
.signal span{font-size:12px;font-weight:650;color:var(--text-3)}.signal strong{font:22px/1 "Cascadia Mono",Consolas,monospace;font-weight:520}
.panel{background:#101316;border:1px solid var(--line-strong)}.panel-head{min-height:54px;padding:9px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h2{font-size:16px;font-weight:680}.panel-head p{margin-top:3px;font-size:12px;color:var(--text-3)}.count{font:12px/1.4 "Cascadia Mono",Consolas,monospace;color:var(--text-3)}
.target-columns,.target-summary{display:grid;grid-template-columns:minmax(290px,1.2fr) minmax(226px,1fr) minmax(176px,.75fr) 42px;align-items:center}
.target-columns{min-height:34px;background:#0f1214;border-bottom:1px solid var(--line-strong);font-size:11px;font-weight:720;color:var(--text-3);letter-spacing:.06em}
.target-columns>span{padding:0 14px}.target-columns>span+span{border-left:1px solid #252b30}
.target-item{background:#14181b}.target-item+.target-item{border-top:1px solid var(--line)}
.target-summary{min-height:56px}.target-summary:hover{background:#171c20}.target-summary>*{display:flex;align-items:center;min-width:0;min-height:56px;padding:7px 14px}.target-summary>*+*{border-left:1px solid #252b30}
.target-identity{gap:9px}.expand-target{width:28px;height:28px;flex:none;padding:0;display:grid;place-items:center;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--text-3)}
.expand-target:hover{color:var(--text);background:var(--surface-4);border-color:var(--line-strong)}.expand-target svg{width:14px;height:14px;transition:transform 140ms ease}.expand-target[aria-expanded="true"] svg{transform:rotate(90deg)}
.tool-icon{display:grid;place-items:center;width:30px;height:30px;flex:none;color:var(--text-2);background:var(--surface-3);border:1px solid var(--line-strong);border-radius:6px}
.target-name{min-width:0;flex:1}.target-name strong{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.target-name small{display:block;color:var(--text-3);font:11px/1.3 "Cascadia Mono",Consolas,monospace;margin-top:2px}
.runtime-cell,.monitor-cell{justify-content:space-between;gap:8px}.state-readout{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font-size:12px;font-weight:720;letter-spacing:.025em}
.ready{color:var(--ready)}.warn{color:var(--warn)}.stopped{color:var(--stopped)}.danger{color:var(--danger)}
.lamp{width:8px;height:8px;flex:none;border-radius:50%;background:currentColor;outline:1px solid rgba(255,255,255,.1);outline-offset:2px}
.inline-controls{display:flex;align-items:center;gap:4px;margin-left:auto}.compact-btn{display:inline-grid;place-items:center;width:34px;height:34px;padding:0;color:var(--text-2);background:transparent;border:1px solid transparent;border-radius:5px}
.compact-btn:hover:not(:disabled){color:var(--text);background:var(--surface-4);border-color:var(--line-strong)}.compact-btn.start{color:var(--brass-strong)}.compact-btn.stop{color:var(--danger)}
.monitor-open{min-height:34px;min-width:68px;padding:0 10px;color:var(--brass-strong);background:transparent;border:1px solid var(--line-strong);border-radius:5px;font-size:12px;white-space:nowrap}
.monitor-open:hover{background:var(--surface-4)}.more-cell{position:relative;justify-content:center;padding:7px 4px!important}
.more-trigger{display:grid;place-items:center;width:30px;height:30px;color:var(--text-3);background:transparent;border:1px solid transparent;border-radius:5px}
.more-trigger:hover,.more-trigger[aria-expanded="true"]{color:var(--text);background:var(--surface-4);border-color:var(--line-strong)}.more-trigger svg{fill:currentColor;stroke:none}
.row-menu{position:absolute;z-index:8;top:47px;right:5px;width:160px;padding:5px;background:#111518;border:1px solid var(--line-strong);border-radius:6px;box-shadow:0 12px 28px rgba(0,0,0,.42)}
.row-menu button{width:100%;min-height:34px;padding:0 9px;color:var(--text-2);background:transparent;border:0;border-radius:4px;font-size:12px;text-align:left}.row-menu button:hover{background:var(--surface-4);color:var(--text)}.row-menu button.danger{color:var(--danger)}
.target-detail{background:#101417;border-top:1px solid var(--line)}.target-detail-inner{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);padding-left:42px}
.detail-block{min-width:0;padding:13px 16px 14px}.detail-block+.detail-block{border-left:1px solid var(--line)}
.detail-title{font-size:12px;font-weight:650;margin-bottom:8px}.component-line{display:grid;grid-template-columns:76px 96px minmax(0,1fr);gap:12px;min-height:34px;align-items:center;border-top:1px solid #252b30;font-size:12px}
.component-line>span:first-child{color:var(--text-2)}.component-line>span:last-child{color:var(--text-3);overflow-wrap:anywhere}
.meta-line{min-height:34px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #252b30;font-size:12px}.meta-line>span{color:var(--text-3)}.meta-line strong{font-weight:600;color:var(--text-2)}
.switch-label{display:flex;align-items:center;gap:6px;min-height:34px;flex:none;font-size:11px;color:var(--text-3);white-space:nowrap}.switch-label input{appearance:none;width:28px;height:16px;flex:none;margin:0;border:1px solid var(--line-strong);border-radius:999px;background:var(--surface-4);position:relative;cursor:pointer}
.switch-label input:before{content:"";position:absolute;left:2px;top:2px;width:10px;height:10px;background:var(--stopped);border-radius:50%;transition:transform 140ms ease}
.switch-label input:checked{background:var(--brass-soft);border-color:var(--brass)}.switch-label input:checked:before{background:var(--brass-strong);transform:translateX(12px)}
.detail-note{font-size:12px;color:var(--text-3);margin-top:10px}.error-note{font-size:12px;color:var(--danger);margin-top:8px}
.launcher-columns,.launcher-row{display:grid;grid-template-columns:minmax(230px,1.1fr) minmax(180px,1fr) 96px 88px 88px;align-items:center}
.launcher-columns{min-height:34px;color:var(--text-3);background:#0f1214;font-size:11px;font-weight:720;border-bottom:1px solid var(--line-strong)}.launcher-columns>span{padding:0 14px;white-space:nowrap}
.launcher-item{background:#14181b}.launcher-item+.launcher-item{border-top:1px solid var(--line)}.launcher-row>*{padding:12px 14px;min-width:0}.launcher-row{min-height:62px}
.launcher-identity{display:flex;align-items:center;gap:10px}.launcher-description{color:var(--text-2);font-size:12px}.launcher-row .button{min-height:34px;padding:0 8px;white-space:nowrap}.launcher-row>:nth-child(n+3){padding-left:8px;padding-right:8px}.launcher-columns>span:nth-child(3){text-align:center}.launcher-row>:nth-child(3){display:flex;justify-content:center}
.favorite{width:34px;height:34px;display:grid;place-items:center;padding:0;color:var(--text-3);background:transparent;border:1px solid transparent;border-radius:5px;font-size:19px}
.favorite[aria-pressed="true"]{color:var(--brass-strong)}.favorite:hover{background:var(--surface-4);border-color:var(--line-strong)}
.footer{padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line-strong);font-size:12px;color:var(--text-3);background:#101316;border-radius:0 0 10px 10px}
dialog{width:min(460px,calc(100vw - 32px));padding:20px;color:var(--text);background:#111417;border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 24px 70px rgba(0,0,0,.48)}dialog::backdrop{background:rgba(0,0,0,.58)}
.dialog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.dialog-head h2{font-size:16px}dialog label{display:block;color:var(--text-2);font-size:12px;margin:12px 0 6px}
dialog input[type="text"]{width:100%;min-height:38px;padding:8px 10px;color:var(--text);background:var(--bg);border:1px solid var(--line-strong);border-radius:6px}
.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}
@media(min-width:1480px){.shell{margin:16px auto}}@media(max-width:1480px){.shell{margin:12px}}
@media(max-width:820px){.content{padding:12px}.target-columns,.target-summary{grid-template-columns:minmax(210px,1fr) minmax(210px,1fr) minmax(138px,.7fr) 36px}.target-summary>*{padding:7px 8px}.target-identity{gap:5px}.target-name small{font-size:10px}.tool-icon{display:none}.target-detail-inner{padding-left:0}.monitor-open{min-width:56px;padding:0 7px}.launcher-columns,.launcher-row{grid-template-columns:minmax(180px,1fr) minmax(130px,.8fr) 88px 74px 72px}}
@media(max-width:640px){.topbar{flex-wrap:wrap}.tabs{gap:15px}.tab{font-size:12px}.target-columns{display:none}.target-summary{grid-template-columns:minmax(0,1fr) 42px}.target-identity{grid-column:1;grid-row:1}.runtime-cell{grid-column:1;grid-row:2}.monitor-cell{grid-column:1;grid-row:3}.more-cell{grid-column:2;grid-row:1/4;align-self:stretch}.target-summary>*{min-height:42px}.target-summary>.runtime-cell,.target-summary>.monitor-cell{border-left:0;border-top:1px solid #252b30;padding-left:44px}.tool-icon{display:grid}.target-detail-inner{grid-template-columns:1fr}.detail-block+.detail-block{border-left:0;border-top:1px solid var(--line)}.component-line{grid-template-columns:65px 80px 1fr;gap:8px}.summary{grid-template-columns:repeat(2,1fr)}.signal:nth-child(3){border-left:0}.signal:nth-child(n+3){border-top:1px solid var(--line)}.launcher-columns{display:none}.launcher-row{grid-template-columns:minmax(0,1fr) 68px 68px 42px;padding:8px}.launcher-identity{grid-column:1/-1}.launcher-description{grid-column:1}.launcher-row>*{padding:6px}.launcher-row .button{padding:0 7px}.footer{align-items:flex-start;flex-direction:column;gap:5px}}
@media(pointer:coarse){.compact-btn,.expand-target,.more-trigger,.favorite{width:44px;height:44px}.button,.monitor-open,.tab,.row-menu button{min-height:44px}.target-columns,.target-summary{grid-template-columns:minmax(200px,1fr) minmax(240px,1fr) minmax(160px,.75fr) 48px}@media(max-width:760px){.target-columns{display:none}.target-summary{grid-template-columns:minmax(0,1fr) 48px}.target-identity{grid-column:1;grid-row:1}.runtime-cell{grid-column:1;grid-row:2}.monitor-cell{grid-column:1;grid-row:3}.more-cell{grid-column:2;grid-row:1/4;align-self:stretch}.target-summary>.runtime-cell,.target-summary>.monitor-cell{border-left:0;border-top:1px solid #252b30;padding-left:16px}}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar"><div class="brand"><div class="brand-glyph" id="brand-glyph"></div><div><h1>Loctl</h1><p>Local Utility Control Layer</p></div></div><div class="demo-status"><span class="mock-badge">MOCK</span><span>Swibo統合版 · サンプル状態</span></div></header>
<nav class="tabs" role="tablist" aria-label="管理ページ"><button class="tab" type="button" id="runtime-tab" role="tab" aria-controls="runtime-page" aria-selected="true">ランタイム・モニター</button><button class="tab" type="button" id="launcher-tab" role="tab" aria-controls="launcher-page" aria-selected="false" tabindex="-1">アプリランチャー</button></nav>
<main>
<section class="content" id="runtime-page" role="tabpanel" aria-labelledby="runtime-tab">
<div class="toolbar"><div class="toolbar-group"><button class="button primary" type="button" data-bulk="start">すべて開始</button><button class="button destructive" type="button" data-bulk="stop">すべて停止</button></div><div class="toolbar-group"><span class="updated" id="updated">サンプル状態</span><button class="button" type="button" id="refresh">状態を更新</button></div></div>
<div class="summary" aria-label="サンプルのランタイム件数" id="summary"></div>
<div class="panel"><header class="panel-head"><div><h2>ランタイム・モニター</h2><p>常駐サービスと専用ウィンドウを個別に管理</p></div><span class="count">4 targets</span></header><div class="target-columns" aria-hidden="true"><span>対象</span><span>ランタイム · 開始 / 停止 / 再起動</span><span>モニター</span><span></span></div><div id="target-rows"></div></div>
</section>
<section class="content" id="launcher-page" role="tabpanel" aria-labelledby="launcher-tab" hidden><div class="toolbar"><div class="toolbar-group"><button class="button primary" type="button" id="add-app">アプリを追加</button></div><span class="updated">起動先・表示名・お気に入りを管理</span></div><div class="panel"><header class="panel-head"><div><h2>アプリランチャー</h2><p>アプリの起動と登録設定</p></div><span class="count" id="app-count">3 apps</span></header><div class="launcher-columns" aria-hidden="true"><span>アプリ</span><span>用途</span><span>お気に入り</span><span>起動</span><span>登録編集</span></div><div id="launcher-rows"></div></div></section>
</main>
<footer class="footer"><span id="feedback" role="status" aria-live="polite">操作はこのモック内に反映されます</span><span>Swibo Design Parts Sheet v2</span></footer>
</div>
<dialog id="app-dialog" aria-labelledby="app-dialog-title"><form id="app-form"><div class="dialog-head"><h2 id="app-dialog-title">アプリを追加</h2><button class="button quiet" type="button" id="close-dialog" aria-label="閉じる">閉じる</button></div><label for="app-name">表示名</label><input type="text" id="app-name" name="name" maxlength="80" required><label for="app-description">用途</label><input type="text" id="app-description" name="description" maxlength="120"><label for="app-command">起動先</label><input type="text" id="app-command" name="command" maxlength="160" required><p class="detail-note">登録内容はサンプルです。実際のアプリは起動しません。</p><div class="dialog-actions"><button class="button" type="button" id="cancel-dialog">キャンセル</button><button class="button primary" type="submit">保存</button></div></form></dialog>
<script>
const icons={"start":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m8 5 11 7-11 7V5Z\"/></svg>","stop":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><rect x=\"7\" y=\"7\" width=\"10\" height=\"10\" rx=\"1\"/></svg>","restart":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M19 8V4l-2 2a8 8 0 1 0 2.2 8M19 4h-4\"/></svg>","disclosure":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"m9 6 6 6-6 6\"/></svg>","tool":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><path d=\"M5 7h14v10H5zM9 4v3M15 4v3M9 17v3M15 17v3\"/></svg>","more":"<svg viewBox=\"0 0 24 24\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"5\" r=\"1.35\"/><circle cx=\"12\" cy=\"12\" r=\"1.35\"/><circle cx=\"12\" cy=\"19\" r=\"1.35\"/></svg>"};
const targets=[
{id:"converlay",name:"Converlay",state:"READY",server:"READY",tunnel:"NONE",monitor:true,auto:true},
{id:"praxiom",name:"Praxiom",state:"READY",server:"READY",tunnel:"NONE",monitor:false,auto:false},
{id:"workbridge",name:"Workbridge",state:"READY",server:"READY",tunnel:"READY",monitor:true,auto:true},
{id:"market-scout",name:"Market Scout",state:"STOPPED",server:"STOPPED",tunnel:"NONE",monitor:false,auto:true}
];
const apps=[{id:"sopsshelf",name:"SOPSshelf",description:"Secret管理",command:"sopsshelf",favorite:true,opened:false},{id:"archive",name:"ChatGPT Archive Manager",description:"チャットの保管・整理",command:"archive-manager",favorite:false,opened:false},{id:"browser",name:"AI Browser Profile Launcher",description:"AI用ブラウザプロファイル",command:"browser-profile-launcher",favorite:true,opened:false}];
const expanded=new Set();let editingId=null;
const escapeHtml=value=>String(value).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#39;");
const byId=id=>document.getElementById(id);
const notify=text=>{byId("feedback").textContent=text;};
const stateClass=state=>state==="READY"?"ready":["STARTING","STOPPING","DEGRADED"].includes(state)?"warn":state==="ERROR"?"danger":"stopped";
const readout=state=>'<span class="state-readout '+stateClass(state)+'"><span class="lamp" aria-hidden="true"></span>'+state+'</span>';
const actionButton=(target,action,label,disabled)=>'<button type="button" class="compact-btn '+action+'" data-id="'+target.id+'" data-action="'+action+'" title="'+label+'" aria-label="'+escapeHtml(target.name+'：'+label)+'" '+(disabled?'disabled':'')+'>'+icons[action]+'</button>';
function renderTargets(){
byId("target-rows").innerHTML=targets.map(t=>{
const running=t.state==="READY"||t.state==="DEGRADED",busy=["STARTING","STOPPING"].includes(t.state),isExpanded=expanded.has(t.id);
return '<article class="target-item" data-target="'+t.id+'"><div class="target-summary"><div class="target-identity"><button type="button" class="expand-target" data-expand="'+t.id+'" aria-controls="detail-'+t.id+'" aria-expanded="'+isExpanded+'" aria-label="'+t.name+'：詳細を'+(isExpanded?'閉じる':'表示')+'">'+icons.disclosure+'</button><span class="tool-icon">'+icons.tool+'</span><div class="target-name" title="'+t.name+'"><strong>'+t.name+'</strong><small>'+t.id+'</small></div><label class="switch-label" title="自動起動の変更は次回起動時に適用"><input type="checkbox" data-auto="'+t.id+'" aria-label="'+t.name+'：自動起動" '+(t.auto?'checked':'')+'><span>自動起動</span></label></div><div class="runtime-cell">'+readout(t.state)+'<div class="inline-controls">'+actionButton(t,"start","開始",running||busy)+actionButton(t,"stop","停止",!running||busy)+actionButton(t,"restart","再起動",!running||busy)+'</div></div><div class="monitor-cell">'+readout(t.monitor?(running?"READY":"DEGRADED"):"STOPPED")+'<button class="monitor-open" type="button" data-monitor="'+t.id+'" title="'+(t.monitor?'モニターを前面に表示':'モニターを開く')+'" aria-label="'+t.name+'：モニター表示">表示</button></div><div class="more-cell"><button type="button" class="more-trigger" data-menu="'+t.id+'" aria-label="'+t.name+'：その他の操作" aria-expanded="false" aria-controls="menu-'+t.id+'">'+icons.more+'</button><div class="row-menu" id="menu-'+t.id+'" hidden><button type="button" data-expand="'+t.id+'">詳細を'+(isExpanded?'閉じる':'表示')+'</button><button type="button" data-close-monitor="'+t.id+'" '+(!t.monitor?'disabled':'')+'>モニターを閉じる</button></div></div></div><div class="target-detail" id="detail-'+t.id+'" '+(!isExpanded?'hidden':'')+'><div class="target-detail-inner"><section class="detail-block"><h3 class="detail-title">ランタイムの構成</h3><div class="component-line"><span>Server</span>'+readout(t.server)+'<span>サービスのヘルスチェック</span></div><div class="component-line"><span>Tunnel</span>'+readout(t.tunnel)+'<span>'+(t.tunnel==="NONE"?'設定なし':'トンネル接続')+'</span></div><p class="detail-note">モニターは独立して開閉できます。</p></section><section class="detail-block"><h3 class="detail-title">対象情報</h3><div class="meta-line"><span>モニター</span><strong>'+(t.monitor?'ウィンドウ表示中':'ウィンドウ未表示')+'</strong></div><div class="meta-line"><span>対象ID</span><strong>'+t.id+'</strong></div><p class="detail-note">自動起動の変更は次回起動時に適用します。</p></section></div></div></article>';
}).join("");
const counts=[["稼働中",targets.filter(t=>t.state==="READY").length],["要確認",targets.filter(t=>["DEGRADED","ERROR"].includes(t.state)).length],["停止中",targets.filter(t=>t.state==="STOPPED").length],["登録対象",targets.length]];
byId("summary").innerHTML=counts.map(([label,value])=>'<div class="signal"><span>'+label+'</span><strong>'+value+'</strong></div>').join("");
}
function renderApps(){
byId("app-count").textContent=apps.length+" apps";
byId("launcher-rows").innerHTML=apps.map(a=>'<article class="launcher-item" data-app="'+a.id+'"><div class="launcher-row"><div class="launcher-identity"><span class="tool-icon">'+icons.tool+'</span><div class="target-name"><strong>'+escapeHtml(a.name)+'</strong><small>'+escapeHtml(a.command)+'</small></div></div><span class="launcher-description">'+escapeHtml(a.description)+'</span><div><button class="favorite" type="button" data-favorite="'+a.id+'" aria-pressed="'+a.favorite+'" aria-label="'+escapeHtml(a.name)+'：お気に入り">'+(a.favorite?'★':'☆')+'</button></div><div><button class="button" type="button" data-launch="'+a.id+'">'+(a.opened?'表示':'起動')+'</button></div><div><button class="button quiet" type="button" data-edit="'+a.id+'">編集</button></div></div></article>').join("");
}
function selectPage(page,focus=false){
for(const name of ["runtime","launcher"]){const tab=byId(name+"-tab"),active=name===page;tab.setAttribute("aria-selected",String(active));tab.tabIndex=active?0:-1;byId(name+"-page").hidden=!active;if(active&&focus)tab.focus();}
}
function closeMenus(){document.querySelectorAll(".row-menu").forEach(el=>el.hidden=true);document.querySelectorAll("[data-menu]").forEach(el=>el.setAttribute("aria-expanded","false"));}
function perform(target,action){
if(["STARTING","STOPPING"].includes(target.state))return;
target.state=action==="stop"?"STOPPING":"STARTING";renderTargets();notify(target.name+"："+(action==="stop"?"停止中":"起動中")+"（モック）");
setTimeout(()=>{target.state=action==="stop"?"STOPPED":"READY";target.server=target.state;if(target.tunnel!=="NONE")target.tunnel=target.state;renderTargets();notify(target.name+"："+({start:"開始",stop:"停止",restart:"再起動"}[action])+"完了（モック）");},280);
}
function editApp(id=null){editingId=id;const app=apps.find(a=>a.id===id);byId("app-dialog-title").textContent=app?"アプリ登録を編集":"アプリを追加";byId("app-name").value=app?.name||"";byId("app-description").value=app?.description||"";byId("app-command").value=app?.command||"";byId("app-dialog").showModal();}
document.addEventListener("click",event=>{
const button=event.target.closest("button");if(!button||button.disabled){if(!event.target.closest(".more-cell"))closeMenus();return;}
const d=button.dataset;
if(button.id==="runtime-tab"||button.id==="launcher-tab"){selectPage(button.id.split("-")[0]);closeMenus();return;}
if(d.menu){const menu=byId("menu-"+d.menu),opening=menu.hidden;closeMenus();menu.hidden=!opening;button.setAttribute("aria-expanded",String(opening));return;}
closeMenus();
if(d.expand){const id=d.expand;expanded.has(id)?expanded.delete(id):expanded.add(id);renderTargets();const focus=document.querySelector('[data-target="'+id+'"] .expand-target');focus.focus();return;}
if(d.action){perform(targets.find(t=>t.id===d.id),d.action);return;}
if(d.monitor||d.closeMonitor){const t=targets.find(t=>t.id===(d.monitor||d.closeMonitor));t.monitor=Boolean(d.monitor);renderTargets();notify(t.name+"："+(t.monitor?"モニター表示":"モニターを閉じる")+"（モック）");return;}
if(d.bulk){targets.filter(t=>d.bulk==="start"?t.state==="STOPPED":t.state==="READY"||t.state==="DEGRADED").forEach(t=>perform(t,d.bulk));return;}
if(button.id==="refresh"){byId("updated").textContent="確認 "+new Date().toLocaleTimeString("ja-JP");notify("サンプル状態を再表示しました");return;}
if(button.id==="add-app"){editApp();return;}
if(d.edit){editApp(d.edit);return;}
if(d.favorite){const a=apps.find(a=>a.id===d.favorite);a.favorite=!a.favorite;renderApps();document.querySelector('[data-favorite="'+a.id+'"]').focus();return;}
if(d.launch){const a=apps.find(a=>a.id===d.launch);a.opened=true;renderApps();notify(a.name+"：起動／前面に表示（モック）");return;}
if(["close-dialog","cancel-dialog"].includes(button.id))byId("app-dialog").close();
});
document.addEventListener("change",event=>{const id=event.target.dataset.auto;if(id){const t=targets.find(t=>t.id===id);t.auto=event.target.checked;notify(t.name+"：自動起動 "+(t.auto?"ON":"OFF")+"（次回起動時に適用）");}});
document.querySelector(".tabs").addEventListener("keydown",event=>{if(["ArrowLeft","ArrowRight","Home","End"].includes(event.key)){event.preventDefault();const current=byId("runtime-tab").getAttribute("aria-selected")==="true";selectPage(event.key==="Home"?"runtime":event.key==="End"?"launcher":current?"launcher":"runtime",true);}});
document.addEventListener("keydown",event=>{if(event.key==="Escape")closeMenus();});
byId("app-form").addEventListener("submit",event=>{event.preventDefault();const name=byId("app-name").value.trim(),command=byId("app-command").value.trim();if(!name||!command){notify("表示名と起動先を入力してください");return;}const values={name,command,description:byId("app-description").value.trim()};if(editingId)Object.assign(apps.find(a=>a.id===editingId),values);else apps.push({id:"app-"+Date.now(),...values,favorite:false,opened:false});renderApps();byId("app-dialog").close();notify(name+"：登録を保存（モック）");});
byId("brand-glyph").innerHTML=icons.tool;renderTargets();renderApps();
</script>
</body>
</html>
